<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitbyom.com</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
  scroll-behavior:smooth;
}
body{
  margin:0;
  background:#e6e6e6;
}
.container{
  max-width:1000px;
  margin:20px auto;
  display:flex;
  flex-wrap:wrap;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  overflow:hidden;
  background:#0f2c33;
}

/* LEFT */
.left{width:50%;position:relative;}
.left img{width:100%;height:100%;object-fit:cover;}
.menu{
  position:absolute;top:20px;left:20px;color:white;font-size:26px;cursor:pointer;
}

/* RIGHT */
.right{width:50%;color:white;position:relative;padding:20px;}
.nav{display:flex;gap:25px;font-size:14px;}
.nav a{
  color:white;text-decoration:none;font-weight:bold;display:flex;gap:6px;align-items:center;
}
.nav a:hover{color:#f4a300;}
.club{position:absolute;top:20px;right:20px;font-weight:bold;}

/* YELLOW STRIP */
.yellow{
  margin-top:120px;background:#f4a300;color:#0f2c33;padding:30px;transform:skewX(-15deg);
}
.yellow h1,.yellow p,.yellow span{transform:skewX(15deg);margin:0;display:block;}
.yellow h1{font-size:42px;}
.yellow p{font-size:18px;font-weight:bold;}
.yellow span{font-size:14px;margin-top:6px;}

/* BUTTONS */
.buttons{margin-top:40px;display:flex;align-items:center;gap:15px;}
.btn{
  padding:12px 22px;background:#f4a300;color:#0f2c33;font-weight:bold;text-decoration:none;border-radius:4px;
}
.slant{width:2px;height:30px;background:white;transform:rotate(20deg);}

/* SOCIAL ICONS */
.social{margin-top:25px;display:flex;gap:18px;}
.social a{
  color:white;font-size:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.4);border-radius:50%;text-decoration:none;transition:.3s;
}
.social a:hover{background:#f4a300;color:#0f2c33;border-color:#f4a300;}

/* SECTIONS */
.section{
  max-width:1000px;margin:40px auto;padding:40px;background:white;border-radius:10px;
}
.section h2{margin-top:0;color:#0f2c33;}

/* PROFILE */
.profile-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;
}
.profile-box{
  background:#0f2c33;color:white;width:90%;max-width:350px;padding:25px;border-radius:10px;text-align:center;position:relative;
}
.profile-box img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #f4a300;}
.close{position:absolute;top:10px;right:15px;font-size:22px;cursor:pointer;}

/* MOBILE */
@media(max-width:768px){
  .left,.right{width:100%;}
  .yellow{transform:skewX(0);}
  .yellow h1,.yellow p,.yellow span{transform:skewX(0);text-align:center;}
}
</style>
</head>

<body>

<!-- HOME -->
<div class="container" id="home">
  <div class="left">
    <i class="fas fa-bars menu" onclick="openProfile()"></i>
    <img src="file:///C:/om%20HTML%20developer.html/GYM%20girl.html.jpg" alt="Gym Girl">
  </div>

  <div class="right">
    <div class="nav">
      <a href="#home"><i class="fa-solid fa-house"></i> HOME</a>
      <a href="#about"><i class="fa-solid fa-user"></i> ABOUT</a>
      <a href="#services"><i class="fa-solid fa-dumbbell"></i> SERVICES</a>
    </div>

    <div class="club">SPORT CLUB</div>

    <div class="yellow">
      <h1>CROSSFIT</h1>
      <p>SHAPE YOUR BODY</p>
      <span>BUILD STRENGTH • STAY FIT</span>
    </div>

    <div class="buttons">
      <a href="#services" class="btn">START NOW</a>
      <div class="slant"></div>
      <a href="#about" class="btn">READ MORE</a>
    </div>

    <!-- SOCIAL ICONS -->
    <div class="social">
      <a href="https://wa.me/919999999999" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
      <a href="https://instagram.com/yourusername" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://twitter.com/yourusername" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
    </div>

  </div>
</div>

<!-- ABOUT -->
<div class="section" id="about">
  <h2>About Us</h2>
  <p>Professional Crossfit training with expert coaches.</p>
</div>

<!-- SERVICES -->
<div class="section" id="services">
  <h2>Our Services</h2>
  <p>Crossfit Training • Personal Coaching • Strength Programs</p>
</div>

<!-- PROFILE POPUP -->
<div class="profile-overlay" id="profile">
  <div class="profile-box">
    <span class="close" onclick="closeProfile()">×</span>
    <img src="file:///C:/om%20HTML%20developer.html/1762916734161.jpg">
    <h2>Fitbyom.com</h2>
    <p>Fitness Trainer • Crossfit Coach</p>
  </div>
</div>

<script>
function openProfile(){
  document.getElementById("profile").style.display="flex";
}
function closeProfile(){
  document.getElementById("profile").style.display="none";
}
</script>

</body>
</html>
